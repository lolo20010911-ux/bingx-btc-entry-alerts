name: BingX 5m entry monitor
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test / dry-run / scan / backtest'
        required: true
        default: test
        type: choice
        options:
          - test
          - dry-run
          - scan
          - backtest
permissions:
  contents: write
concurrency:
  group: bingx-5m-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MODE: ${{ github.event.inputs.mode || 'scan' }}
        run: python -m src.main --mode "$MODE"
      - name: Upload backtest report
        if: ${{ success() && github.event.inputs.mode == 'backtest' }}
        uses: actions/upload-artifact@v4
        with:
          name: btc-backtest-report
          path: reports/latest_backtest.json
          if-no-files-found: error
          retention-days: 30
      - name: Save last sent signal
        if: success()
        run: |
          if git diff --quiet -- .state/last_signal.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/last_signal.json
          git commit -m "chore: remember latest BTC alert [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
